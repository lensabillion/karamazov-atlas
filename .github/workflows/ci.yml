name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # next-env.d.ts is gitignored and generated, and it is what declares static
      # image imports. Typecheck runs before the build, so generate it first.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      # The check that matters most here. `npm run corpus` silently rebuilt
      # nothing for weeks because of a broken entry-point guard: every derived
      # number went stale while every test still passed. Regenerating the data
      # and failing on a diff would have caught it the day it appeared.
      - name: Derived data matches the pipeline
        run: npm run test:drift

      - name: Build
        run: npm run build

  api:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      # No setup-python step on purpose. The interpreter is whatever
      # api/.python-version says (3.14), and uv installs it if the runner has
      # none to match; naming a version here as well would just be one more
      # place for it to drift, which is the bug this replaced.
      - uses: astral-sh/setup-uv@v7

      # --locked fails if uv.lock and pyproject.toml have drifted apart. That
      # failure is the entire return on committing a lockfile: without it CI,
      # the image and the developer can each resolve a different FastAPI.
      - name: Install
        run: uv sync --locked

      # Two steps rather than one, and both before the database and the tests,
      # so a failure reads as "this is style" and not as a broken build.
      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Build the database from committed data
        run: uv run python -m atlas.ingest
        env:
          ATLAS_DATA_DIR: ${{ github.workspace }}/data
          ATLAS_DB_PATH: ${{ github.workspace }}/data/atlas.db

      - name: Tests
        run: uv run pytest -q
        env:
          ATLAS_DB_PATH: ${{ github.workspace }}/data/atlas.db
