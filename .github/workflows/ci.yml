name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test

      # The check that matters most here. `npm run corpus` silently rebuilt
      # nothing for weeks because of a broken entry-point guard: every derived
      # number went stale while every test still passed. Regenerating the data
      # and failing on a diff would have caught it the day it appeared.
      - name: Derived data matches the pipeline
        run: npm run test:drift

      - name: Build
        run: npm run build

  api:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"

      - name: Build the database from committed data
        run: python -m atlas.ingest
        env:
          ATLAS_DATA_DIR: ${{ github.workspace }}/data
          ATLAS_DB_PATH: ${{ github.workspace }}/data/atlas.db

      - name: Tests
        run: python -m pytest -q
        env:
          ATLAS_DB_PATH: ${{ github.workspace }}/data/atlas.db
