[project]
name = "karamazov-atlas-api"
version = "0.1.0"
description = "Corpus, name morphology and retrieval for the Karamazov Atlas"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

# PEP 735. Dev tooling is not an extra a consumer of the wheel could want to
# install; uv installs groups by default and leaves them out of the built
# distribution, which an optional-dependency extra does not.
[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
